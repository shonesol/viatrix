<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudinary Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #999;
      margin-bottom: 35px;
    }

    /* Upload area */
    .upload-box {
      border: 2px dashed #444;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      background: #1a1a1a;
      margin-bottom: 40px;
      transition: all 0.2s;
    }
    .upload-box:hover,
    .upload-box.dragover {
      border-color: #3b82f6;
      background: #151515;
    }
    #fileInput { display: none; }
    .upload-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 13px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 18px;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: #2563eb; }
    .upload-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 24px;
    }

    /* Gallery grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
      cursor: pointer;
      aspect-ratio: 1;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 92vw;
      max-height: 82vh;
      border-radius: 10px;
      object-fit: contain;
    }
    #lightboxCaption {
      margin-top: 16px;
      color: #ccc;
      font-size: 1.05rem;
    }
    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 28px;
      font-size: 2.8rem;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Photo Gallery</h1>
    <p class="subtitle">Images stored on Cloudinary only (no Firebase Storage)</p>

    <!-- Upload box -->
    <div class="upload-box" id="uploadBox">
      <p>Drag & drop an image here<br>or click the button below</p>
      <input type="file" id="fileInput" accept="image/*">
      <br>
      <button class="upload-btn" id="uploadBtn">Choose Photo</button>
      <div id="status"></div>
    </div>

    <!-- Gallery -->
    <div class="gallery" id="gallery"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImage" src="" alt="">
    <div id="lightboxCaption"></div>
  </div>

  <script>
    // ========================================
    //  CHANGE ONLY THIS LINE
    // ========================================
    const CLOUD_NAME = "ziudh5iv";
    const UPLOAD_PRESET = "YOUR_UNSIGNED_PRESET";   // ← put your preset name here

    // ========================================
    // Elements
    // ========================================
    const fileInput   = document.getElementById("fileInput");
    const uploadBtn   = document.getElementById("uploadBtn");
    const uploadBox   = document.getElementById("uploadBox");
    const statusEl    = document.getElementById("status");
    const gallery     = document.getElementById("gallery");
    const lightbox    = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const closeBtn    = document.getElementById("lightboxClose");

    // ========================================
    // Upload to Cloudinary
    // ========================================
    async function uploadToCloudinary(file) {
      if (!file) return;

      statusEl.style.color = "#aaa";
      statusEl.textContent = "Uploading... please wait";
      uploadBtn.disabled = true;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      try {
        const res = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
          {
            method: "POST",
            body: formData
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error?.message || "Upload failed");
        }

        // Success
        addImageToGallery(data.secure_url, file.name);
        statusEl.style.color = "#4ade80";
        statusEl.textContent = "Upload successful!";
      } catch (err) {
        console.error(err);
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Error: " + err.message;
      } finally {
        uploadBtn.disabled = false;
        fileInput.value = "";
      }
    }

    // ========================================
    // Add image to the gallery
    // ========================================
    function addImageToGallery(url, title) {
      const item = document.createElement("div");
      item.className = "gallery-item";
      item.innerHTML = `<img src="${url}" alt="${title}" loading="lazy">`;
      item.addEventListener("click", () => openLightbox(url, title));
      gallery.prepend(item);
    }

    // ========================================
    // Lightbox
    // ========================================
    function openLightbox(url, title) {
      lightboxImage.src = url;
      lightboxCaption.textContent = title || "";
      lightbox.classList.add("open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
    }

    closeBtn.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    // ========================================
    // Event listeners
    // ========================================
    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) {
        uploadToCloudinary(fileInput.files[0]);
      }
    });

    // Drag & drop
    uploadBox.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadBox.classList.add("dragover");
    });
    uploadBox.addEventListener("dragleave", () => {
      uploadBox.classList.remove("dragover");
    });
    uploadBox.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadBox.classList.remove("dragover");
      if (e.dataTransfer.files[0]) {
        uploadToCloudinary(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
